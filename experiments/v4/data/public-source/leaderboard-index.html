<script src="/survey26/platform/restore-route.js"></script>
    <meta charset="UTF-8" />
    <script>
      // The platform now lives on the official GOSIM domain; the personal address only forwards.
      if (window.location.hostname === 'bh3gei.github.io') {
        const rest = window.location.pathname.replace(/^\/agent-observer\/?/, '')
        window.location.replace('https://create.gosim.org/survey26/platform/' + rest + window.location.search + window.location.hash)
      }
      // Each release replaces every file, but a browser may keep this page for ten minutes and then ask
      // for script and style files that no longer exist — a blank page the app can never recover from,
      // because it never starts. If one of the site's own files fails to load, fetch a fresh copy of the
      // page once. The app clears the marker only after it has actually started (main.ts), so a genuinely
      // broken release gets exactly one retry and never a reload loop.
      window.addEventListener('error', function (event) {
        var el = event.target
        var url = el && (el.src || el.href)
        if (!url || !/\/assets\/[^/]+\.(js|css)(\?|$)/.test(url)) return
        try {
          if (window.sessionStorage.getItem('sac-asset-retry')) return
          window.sessionStorage.setItem('sac-asset-retry', '1')
        } catch (e) { return }
        var next = new URL(window.location.href)
        next.searchParams.set('_v', String(Date.now()))
        window.location.replace(next.toString())
      }, true)
    </script>

    <script>
      try {
        const redirect = window.sessionStorage.getItem('gosim-pages-redirect')
        const eventBase = '/survey26/platform/'
        if (redirect) {
          const target = new URL(redirect, window.location.origin)
          if (target.origin === window.location.origin && target.pathname.startsWith(eventBase)) {
            window.sessionStorage.removeItem('gosim-pages-redirect')
            window.history.replaceState(null, '', target.pathname + target.search + target.hash)
          }
        }
      } catch (_) {}
    </script>
